<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MVPs</title>
  <style>
    :root {
      --ink: #101418;
      --muted: #58636f;
      --line: #dbe2e8;
      --bg: #f5f7f8;
      --panel: #ffffff;
      --brand: #00d997;
      --dark: #07100d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      padding: 28px 18px;
      color: #fff;
      background: var(--dark);
      border-bottom: 5px solid var(--brand);
    }

    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    h1, p { margin: 0; }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.05;
    }

    header p {
      margin-top: 8px;
      color: #d7eee6;
      font-size: 16px;
    }

    main {
      padding: 22px 18px 36px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .card {
      display: grid;
      gap: 12px;
      min-height: 150px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
    }

    .card:hover,
    .card:focus {
      outline: 3px solid rgba(0, 217, 151, 0.25);
      border-color: var(--brand);
    }

    .card strong {
      font-size: 20px;
    }

    .card span {
      color: var(--muted);
      line-height: 1.4;
    }

    .tag {
      align-self: end;
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      color: #07100d;
      background: var(--brand);
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Personal MVPs</h1>
      <p>Atalhos publicos para prototipos e automacoes em validacao.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="grid">
      <a class="card" href="./shm-op/">
        <strong>SHM OP</strong>
        <span>Formulario de lancamento de ordem de producao com PDF, e-mail e compartilhamento.</span>
        <span class="tag">Abrir MVP</span>
      </a>
    </div>
  </main>
</body>
</html>
